<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Иконка AgentForge Studio.

    Знак — наковальня с искрой: приложение и называется кузницей, и работает
    как кузница, а не как редактор. Силуэт выбран из соображения читаемости:
    вытянутый рог слева, широкая плита, талия, тяжёлое основание — это
    опознаётся даже на 16 пикселях, где любая надпись превращается в грязь.

    Плитка — остывший уголь, металл на ней раскалён: цвет несёт смысл, а не
    просто украшает. Тёплое свечение под наковальней держит эту мысль, иначе
    оранжевая фигура на чёрном читается как обычная заливка.

    Пересобрать после правки: npm run icon
  -->
  <defs>
    <linearGradient id="coal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.55" stop-color="#191a1d"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset="0.42" stop-color="#ffa53d"/>
      <stop offset="1" stop-color="#ef4f14"/>
    </linearGradient>
    <radialGradient id="forgeGlow" cx="0.5" cy="0.58" r="0.46">
      <stop offset="0" stop-color="#ff8a2b" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#ff6a18" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff6a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#coal)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#forgeGlow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="115" fill="none"
        stroke="url(#rim)" stroke-width="3"/>

  <!--
    Наковальня одной фигурой: рог, плита, талия, основание.
    Рог вытянут, а основание тяжёлое намеренно — при уменьшении детали
    исчезают, но силуэт остаётся, и по нему предмет и опознаётся.
  -->
  <path fill="url(#hot)"
        d="M80 250 L172 204 L384 204 Q396 204 396 216 L396 244 Q396 256 384 256 L314 256 L320 310
           L352 310 Q364 310 364 322 L364 372 Q364 384 352 384 L174 384 Q162 384 162 372 L162 322
           Q162 310 174 310 L206 310 L212 256 L90 256 Q76 256 80 250 Z"/>

  <!-- Искры от удара: звезда и два уголька, светлее самого металла. -->
  <g fill="#ffe6bd">
    <path d="M390 122 L400 150 L428 160 L400 170 L390 198 L380 170 L352 160 L380 150 Z" opacity="0.95"/>
    <circle cx="332" cy="116" r="8" opacity="0.75"/>
    <circle cx="428" cy="100" r="5.5" opacity="0.6"/>
  </g>
</svg>
